name: Docker image

# Publishes ghcr.io/<owner>/sammelband for linux/amd64 and linux/arm64.
# - A published GitHub release (tag vX.Y.Z or vX.Y.Z-beta.N): tags the version,
#   plus `latest` for stable releases and `beta` for pre-releases.
# - Nightly from main, skipped when nothing was committed in the last day:
#   tags `nightly` and `nightly-YYYYMMDD`. "Run workflow" builds one right away.

on:
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Always runs and always sets `build`: an unset output compares as 0 in
      # GitHub's expressions, which would skip releases and manual runs too.
      - name: Anything new for the nightly?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ "$(git rev-list --count --since='25 hours ago' HEAD)" -eq 0 ]; then
            echo "No commits in the last day, skipping the nightly."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        if: steps.changes.outputs.build == 'true'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v6
        id: meta
        if: steps.changes.outputs.build == 'true'
        with:
          images: ghcr.io/${{ github.repository_owner }}/sammelband
          # `latest` only for stable releases (metadata-action skips pre-releases).
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}
            type=raw,value=nightly,enable=${{ github.event_name != 'release' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'release' }}

      - uses: docker/setup-qemu-action@v4
        if: steps.changes.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
