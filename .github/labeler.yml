web:
  - changed-files:
      - any-glob-to-any-file: apps/web/**

server:
  - changed-files:
      - any-glob-to-any-file: apps/server/**

shared:
  - changed-files:
      - any-glob-to-any-file: packages/shared/**

docs:dev:
  - changed-files:
      - any-glob-to-any-file:
          - CLAUDE.md
          - "**/*.md"
          - "!README.md"
          - "!SECURITY.md"

docs:user:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - SECURITY.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Dockerfile
          - docker-compose*.yml
          - .dockerignore
