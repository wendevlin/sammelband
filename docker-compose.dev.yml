services:
  app:
    image: oven/bun:1.4.2
    working_dir: /app
    command: sh -c "bun install && bun run --watch src/index.ts"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/data/sammelband.db
      - UPLOADS_PATH=/uploads
      - SECRET_KEY=dev-secret-not-for-production-change-me
      - BASE_URL=http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - db_data:/data
      - uploads:/uploads

volumes:
  node_modules:
  db_data:
  uploads:
