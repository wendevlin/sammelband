services:
  app:
    image: oven/bun:1.4.2
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/data/sammelband.db
      - UPLOADS_PATH=/uploads
      - SECRET_KEY=dev-secret-not-for-production-change-me
      - BASE_URL=http://localhost:3000
    volumes:
      - .:/app
      # Container-only installs (isolated linker: one per workspace), so the
      # bind mount doesn't mix them with the host's.
      - node_modules:/app/node_modules
      - server_modules:/app/apps/server/node_modules
      - web_modules:/app/apps/web/node_modules
      - shared_modules:/app/packages/shared/node_modules
      - db_data:/data
      - uploads:/uploads

volumes:
  node_modules:
  server_modules:
  web_modules:
  shared_modules:
  db_data:
  uploads:
