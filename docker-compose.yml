services:
  app:
    image: sammelband:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/sammelband.db
      - UPLOADS_PATH=/uploads
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL}
    volumes:
      - db_data:/data
      - uploads:/uploads

volumes:
  db_data:
  uploads:
