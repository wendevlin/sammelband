services:
  app:
    # latest = the newest stable release; also `beta`, `nightly` or a version.
    image: ghcr.io/wendevlin/sammelband:${SAMMELBAND_TAG:-latest}
    restart: unless-stopped
    ports:
      # Host port; the app inside the container always listens on 3000.
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/sammelband.db
      - UPLOADS_PATH=/uploads
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL}
      # The user the app runs as and who owns /data and /uploads.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - db_data:/data
      - uploads:/uploads

volumes:
  db_data:
  uploads:
